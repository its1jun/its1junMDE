<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Markdown Editor</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/editor-content.css">
<link rel="stylesheet" href="css/find-bar.css">
<link rel="stylesheet" href="css/bubble-menu.css">
<link rel="stylesheet" href="css/table.css">
<link rel="stylesheet" href="css/context-menu.css">
<link rel="stylesheet" href="css/dialog.css">
<link rel="stylesheet" href="css/image.css">
<link rel="stylesheet" href="css/tab-bar.css">
</head>
<body>
  <!-- 열려 있는 문서 탭 목록 -->
  <div id="tab-bar"></div>
  <div id="status-bar">
    <span id="status"></span>
  </div>
  <div id="editor-wrap">
    <div id="editor"></div>
  </div>

  <!-- Ctrl+F로 열리는 찾기 바 -->
  <div id="find-bar">
    <input id="find-input" type="text" placeholder="Find" spellcheck="false">
    <span id="find-count"></span>
  </div>

  <!-- 텍스트 선택 시에만 나타나는 플로팅 서식 툴바 -->
  <div id="bubble-menu">
    <button id="bb-bold" title="Bold"><b>B</b></button>
    <button id="bb-italic" title="Italic"><i>I</i></button>
    <button id="bb-strike" title="Strikethrough"><s>S</s></button>
    <button id="bb-code" title="Inline code">&lt;/&gt;</button>
    <div class="sep"></div>
    <button id="bb-h1" title="Heading 1">H1</button>
    <button id="bb-h2" title="Heading 2">H2</button>
    <button id="bb-h3" title="Heading 3">H3</button>
    <div class="sep"></div>
    <button id="bb-quote" title="Quote">"</button>
    <button id="bb-bullet" title="Bullet list">•</button>
    <button id="bb-ordered" title="Numbered list">1.</button>
    <div id="bb-convert-group">
      <div class="sep"></div>
      <button id="bb-tbl-convert" title="Convert to Table">Convert to Table</button>
    </div>
  </div>

  <!-- 표 안에서 우클릭 시 나타나는 컨텍스트 메뉴 -->
  <div id="table-context-menu" class="context-menu">
    <button id="tm-header">Toggle Header</button>
    <button id="tm-row-insert">Insert Row</button>
    <button id="tm-col-insert">Insert Column</button>
    <div class="sep"></div>
    <button id="tm-row-del" class="danger">Delete Row</button>
    <button id="tm-col-del" class="danger">Delete Column</button>
    <button id="tm-tbl-del" class="danger">Delete Table</button>
  </div>

  <div id="image-context-menu" class="context-menu">
    <button id="im-delete" class="danger">Delete Image</button>
  </div>

  <div id="link-context-menu" class="context-menu">
    <button id="lm-edit">Edit Link</button>
    <button id="lm-delete" class="danger">Delete Link</button>
  </div>

  <!-- 표 밖에서 우클릭 시 나타나는 기본 메뉴 -->
  <div id="app-context-menu" class="context-menu">
    <button id="am-new">New</button>
    <button id="am-open">Open</button>
    <button id="am-save">Save</button>
    <button id="am-save-as">Save As...</button>
    <div class="sep"></div>
    <button id="am-insert-table">Insert Table</button>
    <button id="am-insert-link">Insert Link</button>
    <button id="am-insert-image">Insert Image</button>
  </div>

  <!-- 링크/이미지 입력 대화상자 -->
  <div id="insert-dialog-backdrop">
    <div id="insert-dialog" role="dialog" aria-modal="true">
      <h3 id="dlg-title"></h3>
      <label id="dlg-text-row">Text<input id="dlg-text" type="text" spellcheck="false"></label>
      <div class="field">
        <label for="dlg-url">URL</label>
        <div class="input-row">
          <input id="dlg-url" type="text" placeholder="https://" spellcheck="false">
          <button id="dlg-browse" type="button">Browse...</button>
        </div>
      </div>
      <label id="dlg-alt-row">Alt text<input id="dlg-alt" type="text" spellcheck="false"></label>
      <div class="dialog-actions">
        <button id="dlg-remove" class="danger">Remove Link</button>
        <span class="spacer"></span>
        <button id="dlg-cancel">Cancel</button>
        <button id="dlg-ok" class="primary">OK</button>
      </div>
    </div>
  </div>

  <!-- 저장하지 않은 탭을 닫을 때 나타나는 확인 대화상자 -->
  <div id="confirm-dialog-backdrop">
    <div id="confirm-dialog" role="dialog" aria-modal="true">
      <p id="confirm-message"></p>
      <div class="dialog-actions">
        <span class="spacer"></span>
        <button id="confirm-save" class="primary">Save</button>
        <button id="confirm-discard">Don't Save</button>
        <button id="confirm-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/editor.js"></script>
</body>
</html>
